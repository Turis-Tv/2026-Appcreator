<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Turis Radyo</title>

  <style>
    :root{
      --bgA:#0f141b;
      --bgB:#0a0e13;
      --text: rgba(255,255,255,.86);
      --muted: rgba(255,255,255,.55);
      --link: #2aa2ff;
      --gold: #ffc107;
      --shadow: 0 24px 60px rgba(0,0,0,.55);
      --radius: 8px;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; margin:0; }

    body{
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 6px 6px,
        linear-gradient(180deg, var(--bgA), var(--bgB));
    }

    .page{ max-width: 980px; margin: 0 auto; padding: 10px 14px 30px; }

    .slab{
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      overflow: hidden; display: flex; flex-direction: column;
    }

    .content{ padding: 15px 18px 18px; display: flex; flex-direction: column; align-items: center; }

    /* PLAYER SECTIE */
    .bigButtonDock{ display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }

    .bigBtn{
      width: 125px; height: 125px; border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), transparent 52%),
                  radial-gradient(circle at 50% 55%, #2a2f36, #14181e 72%);
      border: 8px solid rgba(0,0,0,.45);
      box-shadow: inset 0 10px 25px rgba(255,255,255,.10), inset 0 -18px 25px rgba(0,0,0,.55), 0 24px 55px rgba(0,0,0,.60);
      display: grid; place-items: center; margin-bottom: 8px;
    }

    .control{ appearance:none; border:0; background: transparent; width: 80px; height: 80px; cursor: pointer; display:grid; place-items:center; }
    .playIcon{ width:0; height:0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 25px solid var(--link); transform: translateX(4px); }

    .control.isPlaying .playIcon{ width: 25px; height: 28px; border:0; position: relative; }
    .control.isPlaying .playIcon::before, .control.isPlaying .playIcon::after{ content:""; position:absolute; top:0; width: 8px; height: 28px; border-radius: 2px; background: var(--link); }
    .control.isPlaying .playIcon::before{ left:0; } .control.isPlaying .playIcon::after{ right:0; }

    /* NAAM & STATUS (KLEINER) */
    .status{ text-align:center; line-height: 1.2; }
    .status strong{ color: #fff; font-size: 12px; display: block; }
    .status span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    /* TABS */
    .tabBar { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabBtn {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted); padding: 5px 14px; border-radius: 20px;
      font-size: 11px; cursor: pointer; transition: all 0.3s;
    }
    .tabBtn.active { background: var(--link) !important; color: white !important; border-color: var(--link) !important; }

    /* NIEUW: Kleur voor Favorieten-tab als er items zijn */
    .tabBtn#tabFav.has-favs {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(255, 193, 7, 0.05);
    }

    /* PLAYLIST KADER */
    .panel {
      width: 100%; border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(0,0,0,.60);
      background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.25));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
    }
    .playlistScroll { max-height: 380px; overflow-y: auto; }

    .row {
      height: 38px; display: flex; align-items: center; padding: 0 10px;
      border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(0,0,0,.55);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.10)); cursor: pointer;
    }
    .row.hidden { display: none; }
    .row.active { background: rgba(42,162,255,0.12); }

    .favBtn { background: none; border: none; font-size: 18px; color: rgba(255,255,255,0.15); cursor: pointer; padding-right: 12px; }
    .favBtn.isFav { color: var(--gold); text-shadow: 0 0 8px rgba(255, 193, 7, 0.6); }

    .row a { color: var(--link); text-decoration: none; font-size: 13px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.active a { color: white; font-weight: bold; }

    .hint { padding: 10px; font-size: 11px; color: var(--muted); text-align: center; }

    /* MODAL */
    .modalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; place-items: center; z-index: 999; }
    .modalOverlay.open { display: grid; }
    .modalBox { background: #1a2029; border-radius: 8px; width: 280px; padding: 15px; border: 1px solid #333; }
    .serverBtn { display: block; width: 100%; padding: 10px; margin-top: 5px; background: rgba(255,255,255,0.05); color: var(--link); border: 1px solid #333; cursor: pointer; text-align: center; }
  </style>
</head>

<body>
  <div class="page">
    <div class="slab">
      <div class="content">
        
        <div class="bigButtonDock">
          <div class="bigBtn">
            <button id="playBtn" class="control" type="button"><span class="playIcon"></span></button>
          </div>
          <div class="status">
            <strong id="stationName">İstasyon Seçin</strong>
            <span id="stationState">Hazır</span>
          </div>
        </div>

        <div style="width: 100%;">
          <div class="tabBar">
            <button class="tabBtn active" id="tabAll" onclick="switchFilter('all')">Hepsi</button>
            <button class="tabBtn" id="tabFav" onclick="switchFilter('fav')">Favoriler ★</button>
          </div>

          <div class="panel">
            <div class="playlistScroll" id="playlistScroll"></div>
            <div class="hint" id="hint">Yükleniyor...</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <audio id="audio" preload="none" crossorigin="anonymous"></audio>

  <div class="modalOverlay" id="modalOverlay">
    <div class="modalBox">
      <h3 style="margin:0 0 10px 0; font-size:14px; text-align:center;">Sunucuyu Seçin</h3>
      <div id="serverList"></div>
      <button onclick="closeModal()" style="width:100%; margin-top:10px; background:none; border:none; color:#555; cursor:pointer; font-size:12px;">Kapat</button>
    </div>
  </div>

  <script>
    const PLAYLIST_URL = "https://raw.githubusercontent.com/Turis-Tv/muzik.json/refs/heads/main/15-Radyolar.txt";
    const FAV_KEY = "tamilRadioFavorites";

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const stationName = document.getElementById('stationName');
    const stationState = document.getElementById('stationState');
    const playlistScroll = document.getElementById('playlistScroll');
    const hint = document.getElementById('hint');
    const modalOverlay = document.getElementById('modalOverlay');
    const serverList = document.getElementById('serverList');
    const tabFavBtn = document.getElementById('tabFav');

    let rows = [];
    let favorites = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    let currentFilter = 'all';

    async function loadPlaylist(){
      try {
        const res = await fetch(PLAYLIST_URL);
        let text = await res.text();
        let jsonStr = text.trim();
        if (jsonStr.includes('[')) jsonStr = jsonStr.substring(jsonStr.indexOf('['));
        if (jsonStr.endsWith(';')) jsonStr = jsonStr.slice(0, -1);
        const fixedJson = jsonStr.replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)(\s*:)/g, '$1"$2"$3');
        const data = JSON.parse(fixedJson);

        const grouped = {};
        data.forEach(st => {
          const name = (st.name || st.Name || st.title || "Onbekend").trim();
          if(!grouped[name]) grouped[name] = [];
          grouped[name].push(st);
        });

        playlistScroll.innerHTML = '';
        rows = [];
        Object.keys(grouped).forEach(name => addRow(name, grouped[name]));

        updateListVisibility();
        updateFavTabHighlight(); // Check bij opstarten
      } catch (err) { hint.textContent = 'Laden mislukt.'; }
    }

    function updateFavTabHighlight() {
      if(favorites.length > 0) {
        tabFavBtn.classList.add('has-favs');
      } else {
        tabFavBtn.classList.remove('has-favs');
      }
    }

    function addRow(name, stations){
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.name = name;
      const isFav = favorites.includes(name);
      const isMulti = stations.length > 1;
      const url = stations[0].url || stations[0].URL || stations[0].stream || stations[0].link;

      row.innerHTML = `
        <button class="favBtn ${isFav ? 'isFav' : ''}">★</button>
        <a>${name}</a>
        ${isMulti ? `<span style="font-size:9px; color:rgba(255,255,255,0.2); margin-left:5px;">${stations.length} SRV</span>` : ''}
      `;

      row.querySelector('.favBtn').onclick = (e) => {
        e.stopPropagation();
        const idx = favorites.indexOf(name);
        if(idx > -1) {
            favorites.splice(idx, 1);
            e.target.classList.remove('isFav');
        } else {
            favorites.push(name);
            e.target.classList.add('isFav');
        }
        localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
        updateFavTabHighlight(); // Update de tab kleur
        if(currentFilter === 'fav') updateListVisibility();
      };

      row.onclick = () => {
        if(isMulti) openModal(name, stations, row);
        else playStream(url, name, row);
      };

      playlistScroll.appendChild(row);
      rows.push(row);
    }

    function playStream(url, name, rowEl){
      rows.forEach(r => r.classList.remove('active'));
      rowEl.classList.add('active');
      stationName.textContent = name;
      stationState.textContent = 'Verbinden...';
      audio.src = url;
      audio.play().catch(() => stationState.textContent = 'Fout');
    }

    function switchFilter(type){
      currentFilter = type;
      document.getElementById('tabAll').classList.toggle('active', type === 'all');
      document.getElementById('tabFav').classList.toggle('active', type === 'fav');
      updateListVisibility();
    }

    function updateListVisibility(){
      let count = 0;
      rows.forEach(r => {
        const isFav = favorites.includes(r.dataset.name);
        const hide = (currentFilter === 'fav' && !isFav);
        r.classList.toggle('hidden', hide);
        if(!hide) count++;
      });
      hint.textContent = count + " Kanallar";
    }

    function openModal(name, stations, rowEl){
      serverList.innerHTML = '';
      stations.forEach((s, i) => {
        const btn = document.createElement('div');
        btn.className = 'serverBtn';
        btn.textContent = 'Server ' + (i+1);
        btn.onclick = () => { playStream(s.url || s.URL || s.stream || s.link, name, rowEl); closeModal(); };
        serverList.appendChild(btn);
      });
      modalOverlay.classList.add('open');
    }

    function closeModal(){ modalOverlay.classList.remove('open'); }

    playBtn.onclick = () => { if(!audio.src) return; audio.paused ? audio.play() : audio.pause(); };
    audio.onplaying = () => { stationState.textContent = 'Çalıyor'; playBtn.classList.add('isPlaying'); };
    audio.onpause = () => { stationState.textContent = 'Duraklatıldı'; playBtn.classList.remove('isPlaying'); };
    audio.onwaiting = () => { stationState.textContent = 'Ara belleğe alınıyor...'; };

    loadPlaylist();
  </script>
</body>
</html>
