*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#111;

  flex-direction:column;
}

header{
  text-align:center;
  padding:10px;
  flex-shrink:0;
  background:#181818;
  border-bottom:1px solid #333;
}
header p{color:#ccc; font-size: 14px;}

.main{
  flex:1;
  display:flex;
  gap:15px;
  padding:15px;
  overflow:hidden;
}

.video-container{
  flex:1;
  background:#000;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}

/* Iframe styling zorgt dat de dynamische iframe goed past */
iframe {
  width:100%;
  height:100%;
  border:none;
  display:block;
  flex:1;
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#666;
  font-size:20px;
  z-index: 1;
  pointer-events: none; /* Zorgt dat je er doorheen kunt klikken als het moet */
}

/* SIDEBAR STYLES */
.channels-sidebar{
  width:280px;
  background:#1e1e1e;
  border-radius:10px;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap: 10px;
  position: relative;
}

.sidebar-header {
  display: flex;
  gap: 8px;
  align-items: center;
}

.cat-select {
  flex: 1;
  background: #333;
  color: #fff;
  border: 1px solid #444;
  padding: 8px;
  border-radius: 6px;
  outline: none;
  cursor: pointer;
}

.menu-btn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  width: 30px;
  text-align: center;
  line-height: 1;
}
.menu-btn:hover { color: #ff6b00; }

.options-menu {
  position: absolute;
  top: 50px;
  right: 10px;
  background: #2c2c2c;
  border: 1px solid #444;
  border-radius: 6px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  display: none;
  z-index: 100;
  min-width: 140px;
}
.options-menu.show { display: block; }

.menu-item {
  padding: 10px;
  font-size: 14px;
  cursor: pointer;
  border-bottom: 1px solid #333;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: #444; color: #ff6b00; }

.channels-list{
  overflow-y:auto;
  flex:1;
  border:1px solid #333;
  border-radius:8px;
  padding:8px;
}

.channel-item{
  background:#2c2c2c;
  margin-bottom:6px;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
  transition:.3s;
  border-left:3px solid transparent;
  font-size: 14px;
}
.channel-item:hover{background:#3a3a3a;transform:translateX(4px);}
.channel-item.active{border-left:3px solid #ff6b00;background:#444;}

.channels-list::-webkit-scrollbar{width:6px;}
.channels-list::-webkit-scrollbar-thumb{background:#ff6b00;border-radius:3px;}
.channels-list::-webkit-scrollbar-track{background:#333;border-radius:3px;}

#m3uInput { display: none; }

@media(max-width:768px){
  .main{flex-direction:column;}
  .channels-sidebar{width:100%;height:300px;}
}
</style>

  function parseM3U(content) {
    const lines = content.split('\n');

    let currentChannel = { category: 'Uncategorized' };

      initApp();
    } else {
      alert("No valid channels found.");
    }
  }

  function updateCategoryDropdown() {
    const categories = ['All', ...new Set(allChannels.map(c => c.category || 'Uncategorized'))].sort();
    categorySelect.innerHTML = '';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    });
  }

  function renderChannels(filterCategory = 'All') {
    list.innerHTML = '';
    const filtered = filterCategory === 'All' 
      ? allChannels 
      : allChannels.filter(c => c.category === filterCategory);

    filtered.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'channel-item';
      div.textContent = ch.name;
      div.addEventListener('click', () => {
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        loadChannel(ch);
      });
      list.appendChild(div);
    });
  }

  categorySelect.addEventListener('change', (e) => {
    renderChannels(e.target.value);
  });

  // DIT IS DE NIEUWE LOGICA VOOR AUTOPLAY
  function loadChannel(ch){
    placeholder.style.display = 'none';

    // 1. Oude iframe verwijderen als die bestaat
    const oldFrame = videoContainer.querySelector('iframe');
    if(oldFrame) {
      oldFrame.remove();
    }

    // 2. URL voorbereiden met autoplay parameters
    let finalUrl = ch.url;
    if (finalUrl.includes('?')) {
        finalUrl += '&autoplay=1';
    } else {
        finalUrl += '?autoplay=1';
    }

    // 3. Nieuwe iframe maken
    const iframe = document.createElement('iframe');
    iframe.src = finalUrl;
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "no-referrer";
    // Dit is de belangrijkste regel voor browsers:
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    
    // 4. Toevoegen aan pagina
    videoContainer.appendChild(iframe);
  }

  function initApp() {
    updateCategoryDropdown();
    renderChannels('All');
  }

  initApp();
});
</script>
</body>


</html>
